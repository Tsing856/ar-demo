
<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>红楼梦 · 大观园全景漫游</title>

  <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/@photo-sphere-viewer/core/index.min.css">

  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three/build/three.module.js",
      "@photo-sphere-viewer/core": "https://cdn.jsdelivr.net/npm/@photo-sphere-viewer/core/index.module.js",
      "@photo-sphere-viewer/gyroscope-plugin": "https://cdn.jsdelivr.net/npm/@photo-sphere-viewer/gyroscope-plugin/index.module.js"
    }
  }
  </script>

  <style>
    * { box-sizing: border-box; }

    html, body, #viewer {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #171512;
      font-family: "Microsoft YaHei", sans-serif;
    }

    #title {
      position: absolute;
      top: 22px;
      left: 0;
      right: 0;
      z-index: 10;
      text-align: center;
      color: #fff1d2;
      font-size: 20px;
      letter-spacing: 3px;
      text-shadow: 0 2px 8px #000;
      pointer-events: none;
    }

    #hint {
      position: absolute;
      top: 56px;
      left: 0;
      right: 0;
      z-index: 10;
      text-align: center;
      color: #fff;
      font-size: 13px;
      text-shadow: 0 2px 6px #000;
      pointer-events: none;
    }

    #status {
      position: absolute;
      bottom: 88px;
      left: 0;
      right: 0;
      z-index: 10;
      text-align: center;
      color: white;
      font-size: 13px;
      text-shadow: 0 2px 6px #000;
      pointer-events: none;
    }

    #gyroBtn {
      position: absolute;
      bottom: max(25px, env(safe-area-inset-bottom));
      left: 50%;
      transform: translateX(-50%);
      z-index: 20;
      padding: 12px 24px;
      border: 1px solid #d7b77b;
      border-radius: 30px;
      color: #fff5e3;
      background: #782e25;
      font-size: 15px;
      white-space: nowrap;
    }

    #gyroBtn:disabled {
      opacity: .65;
    }
  </style>
</head>

<body>
  <div id="viewer"></div>

  <div id="title">大观园 · 春日游记</div>
  <div id="hint">轻触并拖动屏幕，环顾园林四周</div>
  <div id="status">正在进入大观园……</div>
  <button id="gyroBtn" hidden>开启手机体感</button>

  <script type="module">
    import { Viewer } from '@photo-sphere-viewer/core';
    import { GyroscopePlugin }
      from '@photo-sphere-viewer/gyroscope-plugin';

    const status = document.getElementById('status');
    const button = document.getElementById('gyroBtn');

    const viewer = new Viewer({
      container: document.getElementById('viewer'),
      panorama: './daguanyuan-360.png',
      caption: '红楼梦 · 大观园',
      navbar: ['zoom', 'fullscreen'],
      mousemove: true,
      plugins: [
        [GyroscopePlugin, { touchmove: true }]
      ]
    });

    viewer.addEventListener('ready', () => {
      status.textContent = '已入园 · 拖动屏幕即可环顾';
      button.hidden = false;
    });

    button.addEventListener('click', async () => {
      button.disabled = true;

      try {
        const gyro = viewer.getPlugin(GyroscopePlugin);
        await gyro.start();

        status.textContent = '体感已开启 · 转动手机环顾园林';
        button.hidden = true;
      } catch (error) {
        console.error('体感启动失败：', error);
        status.textContent = '暂不能使用体感，请用手指拖动';
        button.disabled = false;
      }
    });

    window.addEventListener('error', (event) => {
      console.error(event.message);
    });
  </script>
</body>
</html>
